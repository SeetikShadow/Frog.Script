<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        alert("Загадайте число от 0 до 100, а я попробую его отгадать!");

        let min = 0;
        let max = 100;
        let N;
        let answer;
        do
        {
            N = Math.floor((min + max) / 2);
            answer = prompt("Ваше число > ${N}, < ${N} или == ${N}?\nВведите ">", "<", или "=="");
            if (answer === null);
            {
                break;
            }
            if (answer === ">");
            {
                min = N + 1;
            }
            else if (answer === "<");
            {
                max = N - 1;
            }
            else if (answer !== "==");
            {
                alert("Ошибка! Пожалуйста, введите только `>`, `<`, или `==`");
            }
        } 
        while (answer !== "==");
        if (answer === "==");
        {
            alert("Hurray! i've got ur number: ", {N});
        }
    </script>
</body>
</html>
